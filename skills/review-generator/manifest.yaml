# Routing configuration for review-generator.
# Uses progressive disclosure: core files always loaded, domain/language fragments loaded on demand.

axes:
  domain:
    detect: "Classify from the requested topic and its evidence base."
    values:
      biomedical: "fragments/domain-biomedical.md"
      cs_ai: "fragments/domain-cs-ai.md"
      cross: "fragments/domain-cross.md"
      general: "fragments/domain-general.md"
  language:
    detect: "Always generate both Chinese and English documents."
    values: {}

always_load:
  - "principles.md"
  - "standards/output-contract.md"

references:
  on_demand:
    citation_formats: "standards/citation-formats.md"
    sequential_citation: "standards/sequential-citation.md"
    database_guide: "guides/database-guide.md"
    deep_analysis: "guides/deep-analysis.md"
    literature_quality_gates: "guides/literature-quality-gates.md"  # §1 loaded after screening, §2 loaded after deep analysis
    review_structure: "templates/structure-common.md"
    scoring_system: "standards/scoring-system.md"
    writing_quality: "standards/writing-quality.md"
    zh_translation: "standards/zh.md"
